<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="rubber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b52"/>
      <stop offset="1" stop-color="#c62828"/>
    </linearGradient>
  </defs>

  <!-- rounded app-coloured tile -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- paddle, tilted for a dynamic look -->
  <g transform="rotate(-30 14 14)">
    <!-- handle -->
    <rect x="12.3" y="16.5" width="3.4" height="10" rx="1.7" fill="#e7b272"/>
    <rect x="13.7" y="16.5" width="2.0" height="10" rx="1.0" fill="#00000022"/>
    <!-- blade: light edge + red rubber -->
    <circle cx="14" cy="12.4" r="7.7" fill="#fdf3ea"/>
    <circle cx="14" cy="12.4" r="6.3" fill="url(#rubber)"/>
    <ellipse cx="11.8" cy="10.1" rx="2.4" ry="1.7" fill="#ffffff" opacity="0.28"/>
  </g>

  <!-- ball flying in, top-right, with motion streaks -->
  <path d="M16.5 7.2 h-3.4 M17.2 9.7 h-2.6" stroke="#ffffff" stroke-opacity="0.75"
        stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="23" cy="8.4" r="3.1" fill="#ffffff"/>
  <circle cx="22" cy="7.4" r="0.9" fill="#ffffff" opacity="0.0"/>
</svg>
